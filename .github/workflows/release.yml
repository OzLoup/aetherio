# Builds the installers and publishes them as a GitHub Release, with fixed
# file names so the README links (releases/latest/download/…) always point
# at the newest version.
#
# Start it by pushing a tag (git tag v0.2.0 && git push origin v0.2.0) or by
# hand: Actions → Release → Run workflow, with the version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME).
      # Same key as the APK already installed, so it updates in place.
      # Without these secrets the APK uses a throwaway debug key.
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../AetherIO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: AetherIO.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build installer
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_URL }}
        run: |
          npm ci --prefix frontend
          cd desktop && npm ci
          test -n "$VITE_API_BASE_URL" || { echo "Set the BACKEND_URL variable"; exit 1; }
          npm run dist:win -- --publish never
          mv dist/AetherIO-Setup-*.exe ../AetherIO-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AetherIO-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dmg
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_URL }}
        run: |
          npm ci --prefix frontend
          cd desktop && npm ci
          npm run dist -- --publish never
          mv dist/*.dmg ../AetherIO-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: AetherIO-mac.dmg

  publish:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" AetherIO.apk AetherIO-Setup.exe AetherIO-mac.dmg \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "AetherIO $TAG" --generate-notes --latest
